site_name: horaceTheCheese
site_description: A WAVE ROVER × ROS 2 project — a little rover that maps the world.
site_url: https://palolz.github.io/horaceTheCheese/
repo_url: https://github.com/palolz/horaceTheCheese
repo_name: palolz/horaceTheCheese
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/cheese-wedge.svg
  favicon: assets/cheese-wedge.svg
  language: en
  font:
    text: Space Grotesk
    code: Space Mono
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.action.edit
    - content.action.view
    - content.code.copy
    - toc.follow

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - Stages:
      - stages/index.md
      - 1 · Chassis & motor control: stages/stage-1-chassis.md
      - 2 · LiDAR bring-up: stages/stage-2-lidar.md
      - 3 · Binocular depth: stages/stage-3-depth.md
      - 4 · Sensor fusion: stages/stage-4-fusion.md
      - 5 · Full SLAM: stages/stage-5-slam.md
      - 6 · Autonomy: stages/stage-6-autonomy.md
  - Architecture: architecture.md
  - Hardware & BOM: hardware.md
  - Build log: build-log.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/palolz/horaceTheCheese
      name: horaceTheCheese on GitHub
